limits:
  basic_blocks: 0x0
  interrupts: 0x0
  mmio_read: 0x0
  input_read_overdue: 0xc3500

interrupt:
  mode: fuzzed
  trigger:
    on-infinite-sleep: false
    interval: false
    custom:
      - name: idle_loop
        pc: 0x25e4

network:
  ani: pemu.artificial_network_interface.ANI
  output: nrf52_coap_client_output.txt
  apriori:
    - field: IEEE802154.LL_dest
      val: 0x35886140f4ce36ed
    - field: IEEE802154.LL_source
      val: 0x2020200127402
    - field: IEEE802154.PAN_source
      val: 0xabcd
  faults:
    probability: 0x14
    target: all
  np_only: true
  analysis: none
  protocols:
    - protocol: [IEEE802154_PHY,6lowpan_MAC_Data, 6lowpan_mesh_frag, 6lowpan, UDP, COAP]

pemu_hooks:
  - address: 0x4950
    hook_type: receive
    mcu: nrf52
  - address: 0x4a2e
    hook_type: transmit
    mcu: nrf52
  #  - address: 0x8c4
  #    hook_type: crash
  #    mcu: nrf52


memory_maps:
  - name: mmio
    address: 0x40000000
    size: 0x20000000
    type: mmio
  - name: ITM_DWT_BPU
    address: 0xe0000000
    size: 0x3000
    type: mmio
  - name: CTI
    address: 0xe0042000
    size: 0x1000
    type: mmio
  - name: ram
    address: 0x20000000
    size: 0x100000
    type: ram
  - name: text
    address: 0x0
    size: 0x1f000
    file:
      path: coap-client.bin
    type: rom
  - name: ficr_uicr
    address: 0x10000000
    size: 0x2000
    file:
      path: "../roms/nrf52840_ficr_uicr.bin"
    type: ram
  - name: dynamically_added_crash_region_0000130
    address: 0xfffb000
    size: 0x5000
    type: ram

mmio_models:
  - context:
      pc: 0x532c
      mmio: 0x40000108
    model:
      constant:
        value: 0x0

exit_hooks:
  - name: app_error_fault_handler
    symbol: app_error_fault_handler
  - name: UsageFault_Handler
    symbol: UsageFault_Handler
  - name: BusFault_Handler
    symbol: BusFault_Handler

symbols:
  - coap-client.elf
script: |
  pub fn main(api) {
    api.on_init(on_init);
  }
  
  fn on_init() {
    common::patch_function("stack_check_init", arm::RETURN);
  }
