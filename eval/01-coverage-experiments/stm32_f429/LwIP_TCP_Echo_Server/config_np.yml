include:
  - config.yml
peripherals:
  stm32f429_eth:
    packet_limit: 30
    class: fuzzware_harness.peripherals.stm32.f429.ETH
    base_addr: 0x40029000
    size: 0x1400
    ani: fuzzware_harness.network.artificial_network_interface.ANI
    network: {}
    irqs:
      # ETH_IRQHandler
      - 77
      - 61

use_timers: True
timers:
  test_timer:
    reload_val: 0x1000
    handler: fuzzware_harness.peripherals.peripheral_timer_trigger
    start_at: 0x8000d08
