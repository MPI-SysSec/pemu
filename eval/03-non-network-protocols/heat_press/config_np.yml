peripherals:
  dummy_periph:
    packet_limit: 30
    class: fuzzware_harness.peripherals.Peripheral
    global_ani: true
    size: 0x0
    base_addr: 0x400e0000
    ani: fuzzware_harness.network.artificial_network_interface.ANI
    network:
      analysis: false
      protocols:
        p1: ['Modbus']
handlers:
  # AFTER _ZN6Modbus11getRxBufferEv
  modbus_reanable_rx: 
    addr: 0x80490
    handler: fuzzware_harness.user_hooks.npfuzz.modbus.data_processed
    do_return: false
  # AT THE END OF _ZN6Modbus12sendTxBufferEv
  modbus_after_tx_wipe: 
    addr: 0x802b8
    handler: fuzzware_harness.user_hooks.npfuzz.modbus.data_processed
    do_return: false
  # ON _ZN9UARTClass10IrqHandlerEv
  modbus_interrupt_handler: 
    addr: 0x812bc
    handler: fuzzware_harness.user_hooks.npfuzz.modbus.irq_rx_hook
    do_return: false
  # AFTER _ZN9UARTClass10IrqHandlerEv first bb
  modbus_handler: 
    addr: 0x812c8
    handler: fuzzware_harness.user_hooks.npfuzz.modbus.rx_hook
    do_return: false
  forkserver_skip:
    addr: startForkserver

mmio_models:
  passthrough:
    modbus_uart_read_model:
      addr: 0x400e0818
      pc: 0x812c8
      init_val: 0
    modbus_do_read:
      addr: 0x400e0814
      pc: 0x812c2
      init_val: 1
interrupt_triggers:
  poll_trigger:
    num_pends: 127
    addr: 0x805e0
    irq: 24

  #trigger:
  #  every_nth_tick: fuzzed
  #  fuzz_mode: fuzzed
